<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>男性パート チャット</title>
  
  <!-- PWA & Web App 設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="男性パート">
  
  <!-- CSS & Leaflet (地図ライブラリ) -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

  <!-- ヘッダー -->
  <header id="app-header">
    <h1 id="page-title">💬 トーク (男性パート)</h1>
  </header>

  <!-- メインコンテンツ領域 -->
  <main id="app-main">
    <!-- メッセージ表示エリア -->
    <div id="message-container"></div>

    <!-- 地図表示エリア -->
    <div id="map-container">
      <div id="map"></div>
    </div>
  </main>

  <!-- 送信・入力コントロールバー -->
  <footer id="input-area">
    <!-- 投稿モード切替 (通常 / 匿名) -->
    <div class="mode-selector">
      <button id="mode-normal" class="mode-btn active">👤 通常</button>
      <button id="mode-anon" class="mode-btn">❓ 匿名</button>
    </div>

    <!-- メッセージ入力欄 ＆ 送信ボタン -->
    <div class="input-composer">
      <input type="text" id="message-input" placeholder="メッセージを入力..." autocomplete="off">
      <button id="send-btn">送信</button>
    </div>
  </footer>

  <!-- 外部SDK (LINE LIFF, Firebase, Leaflet) -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- メインJavaScript -->
  <script src="script.js"></script>
</body>
</html>
