<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>男性パート</title>
<link rel="stylesheet" href="style.css">
<!-- LIFF SDK -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<!-- ヘッダー -->
<header id="main-header">
<div class="header-content">
<h1 id="header-title">ホーム</h1>
<span class="header-sub" id="header-sub"></span>
</div>
<button id="btn-notification" class="btn-icon-header" onclick="requestNotificationPermission()">🔔</button>
</header>
<!-- 1. ホーム画面 -->
<div id="page-home" class="page-content active">
<section class="card profile-card">
<div class="avatar-wrapper">
<img id="user-avatar" src="https://via.placeholder.com/64" alt="アイコン" class="avatar">
<span class="online-indicator"></span>
</div>
<div class="profile-info">
<h3 id="user-name">読み込み中...</h3>
<p id="user-status">LINE連携済み 🐾</p>
</div>
</section>
<!-- ショート投稿エリア -->
<section class="card short-post-box">
<div class="card-header">
<span class="badge badge-green">⚡ SHORT</span>
<h4>ショートに投稿</h4>
</div>
<textarea id="short-input" placeholder="今なにしてる？写真と一緒にシェアしよう"></textarea>
<div id="image-preview-container" style="display:none; margin: 8px 0;">
<img id="image-preview" src="" style="max-width: 100%; max-height: 150px; border-radius: 8px;">
</div>
<div class="post-actions">
<input type="file" id="short-file" accept="image/*" style="display:none;" onchange="previewImage(event)">
<button class="btn-icon" onclick="document.getElementById('short-file').click()">📷 メディアを選択</button>
<button class="btn-primary" onclick="submitShortPost()">投稿する</button>
</div>
</section>
<section class="card menu-section">
<div class="card-header">
<span class="badge badge-green">🎮 MENU</span>
<h4>アクティビティ</h4>
</div>
<div class="menu-grid">
<div class="menu-item"><div class="icon-box icon-game">🎮</div><span>ゲーム</span></div>
<div class="menu-item"><div class="icon-box icon-gift">🎁</div><span>ギフト</span></div>
<div class="menu-item"><div class="icon-box icon-theme">🎨</div><span>着せかえ</span></div>
<div class="menu-item"><div class="icon-box icon-more">➕</div><span>追加機能</span></div>
</div>
</section>
</div>
<!-- 2. トーク画面（LINE風） -->
<div id="page-talk" class="page-content chat-page">
<div id="chat-messages" class="chat-messages">
<div class="system-message">
<span>グループ「男性パート (8人)」が開設されました</span>
</div>
</div>
<div class="chat-input-bar">
<button id="anon-toggle-btn" class="anon-toggle-btn is-anon" onclick="toggleAnonymous()">
<span id="anon-icon">🕵️</span>
<span id="anon-label">匿名</span>
</button>
<input type="text" id="chat-input" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
<button class="chat-send-btn" onclick="sendChatMessage()">送信</button>
</div>
</div>
<!-- 3. 掲示板画面（2ch/5ch風） -->
<div id="page-bbs" class="page-content bbs-page">
<div class="bbs-top-bar">
<button class="btn-create-thread" onclick="openThreadModal()">＋ スレッド作成</button>
</div>
<div id="thread-list-container" class="thread-list"></div>
<div id="thread-detail-container" class="thread-detail" style="display: none;">
<div class="thread-detail-header">
<button class="btn-back-bbs" onclick="backToThreadList()">‹ スレ一覧</button>
<h3 id="detail-thread-title">スレッドタイトル</h3>
</div>
<div id="res-list" class="res-list"></div>
<div class="chat-input-bar bbs-input-bar">
<button id="bbs-anon-toggle-btn" class="anon-toggle-btn is-anon" onclick="toggleBbsAnonymous()">
<span id="bbs-anon-icon">🕵️</span>
<span id="bbs-anon-label">匿名</span>
</button>
<input type="text" id="bbs-res-input" placeholder="レスを書き込む..." onkeypress="handleBbsKeyPress(event)">
<button class="chat-send-btn" onclick="sendBbsRes()">書き込む</button>
</div>
</div>
</div>
<!-- 4. ショート画面 -->
<div id="page-short" class="page-content short-page">
<div id="short-timeline" class="short-timeline-container"></div>
</div>
<!-- 5. 位置情報画面 (whoo風) -->
<div id="page-location" class="page-content location-page">
<div class="map-bg">
<div class="map-grid"></div>
<div id="map-pins-container"></div>
</div>
<div class="map-header-status">
<span class="status-badge">📍 位置情報共有中</span>
<button class="btn-location-toggle" id="btn-loc-toggle" onclick="toggleLocationSharing()">共有: ON</button>
</div>
<div id="user-location-card" class="location-card" style="display: none;">
<div class="loc-card-header">
<img id="card-avatar" src="" class="loc-avatar">
<div class="loc-user-info">
<h4 id="card-name">ユーザー名</h4>
<p id="card-address">📍 GPS取得中...</p>
</div>
</div>
<div class="loc-card-footer">
<span id="card-time">更新: たった今</span>
<button class="btn-chat-direct" onclick="switchPage('talk', '男性パート', '8人のグループ')">💬 トークを開く</button>
</div>
</div>
</div>
<!-- モーダル：スレッド作成 -->
<div id="create-thread-modal" class="modal-overlay" style="display: none;">
<div class="modal-content">
<h3>📋 新しいスレッドを作成</h3>
<label class="modal-label">スレッド名</label>
<input type="text" id="modal-thread-title" placeholder="例: 今日の部活について" class="modal-input">
<label class="modal-label">1>> 最初の書き込み</label>
<textarea id="modal-thread-body" placeholder="スレッドの概要を入力..." class="modal-textarea"></textarea>
<label class="modal-label">投稿モード</label>
<div class="modal-radio-group">
<label class="radio-card active" id="radio-label-anon">
<input type="radio" name="thread-anon" value="anon" checked onclick="selectModalAnon(true)">
<span>🕵️ 匿名で作る</span>
</label>
<label class="radio-card" id="radio-label-normal">
<input type="radio" name="thread-anon" value="normal" onclick="selectModalAnon(false)">
<span>👤 通常で作る</span>
</label>
</div>
<div class="modal-actions">
<button class="btn-cancel" onclick="closeThreadModal()">キャンセル</button>
<button class="btn-primary" onclick="submitNewThread()">スレを建てる</button>
</div>
</div>
</div>
<!-- 下部ナビゲーションバー -->
<nav class="bottom-nav">
<button class="tab-btn active" onclick="switchPage('home', 'ホーム', '')">
<span class="nav-icon">🏠</span><span>ホーム</span>
</button>
<button class="tab-btn" onclick="switchPage('talk', '男性パート', '8人のグループ')">
<span class="nav-icon">💬</span><span>トーク</span>
</button>
<button class="tab-btn" onclick="switchPage('bbs', '掲示板', '')">
<span class="nav-icon">📋</span><span>掲示板</span>
</button>
<button class="tab-btn" onclick="switchPage('short', 'ショートタイムライン', '')">
<span class="nav-icon">⚡</span><span>ショート</span>
</button>
<button class="tab-btn" onclick="switchPage('location', '位置情報', '')">
<span class="nav-icon">📍</span><span>位置情報</span>
</button>
</nav>
<script type="module" src="app.js"></script>
</body>
</html>
